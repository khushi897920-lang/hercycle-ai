name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Provide placeholder env for CI when secrets are missing
        shell: bash
        run: |
          set -euo pipefail
          echo "Providing CI placeholders for missing secrets (safe for forked PRs)"

          if [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ]; then
            echo "NEXT_PUBLIC_SUPABASE_URL=https://ci-placeholder.supabase.co" >> $GITHUB_ENV
          fi

          if [ -z "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-anon-key" >> $GITHUB_ENV
          fi

          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY=ci-service-role" >> $GITHUB_ENV
          fi

          if [ -z "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}" ]; then
            echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_Y2xlcmsuZXhhbXBsZS5jb20k" >> $GITHUB_ENV
          fi

          if [ -z "${CLERK_SECRET_KEY:-}" ]; then
            echo "CLERK_SECRET_KEY=sk_test_ci_clerk_secret_key" >> $GITHUB_ENV
          fi

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "GEMINI_API_KEY=ci-gemini-placeholder-key" >> $GITHUB_ENV
          fi

          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "GROQ_API_KEY=ci-groq-placeholder-key" >> $GITHUB_ENV
          fi

          if [ -z "${NEXT_PUBLIC_APP_URL:-}" ]; then
            echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000" >> $GITHUB_ENV
          fi

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET=ci-cron-secret" >> $GITHUB_ENV
          fi

          if [ -z "${CLERK_WEBHOOK_SECRET:-}" ]; then
            echo "CLERK_WEBHOOK_SECRET=whsec_ci_webhook_secret" >> $GITHUB_ENV
          fi

          if [ -z "${ADMIN_ACCESS_TOKEN:-}" ]; then
            echo "ADMIN_ACCESS_TOKEN=ci-admin-token" >> $GITHUB_ENV
          fi

          if [ -z "${ADMIN_EMAILS:-}" ]; then
            echo "ADMIN_EMAILS=admin@hercycle.app" >> $GITHUB_ENV
          fi

      - name: Run Linter
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Run E2E Integration Tests
        run: npm run test:e2e

